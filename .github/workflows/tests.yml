
name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run CLI smoke test
        run: |
          python -m flowpipe \
            --input examples/people.csv \
            --output "$RUNNER_TEMP/london.json" \
            --filter city=London \
            --select name,age \
            --rename name=full_name

          python -c 'import json, os; p=os.path.join(os.environ["RUNNER_TEMP"], "london.json"); data=json.load(open(p, encoding="utf-8")); assert len(data)==3'
