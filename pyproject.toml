
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpipe-data"
version = "0.1.0"
description = "A configurable CSV and JSON data transformation engine"
requires-python = ">=3.11"

[project.scripts]
flowpipe = "flowpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
